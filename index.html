<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TruckBuild</title>

    <!-- Fill the whole screen, including behind notches, and disable page zoom
         so pinches and double taps reach the game instead of the browser. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#14171c" />

    <!-- Fullscreen when launched from the home screen. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TruckBuild" />

    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <link rel="stylesheet" href="styles/main.css" />
  </head>
  <body>
    <canvas id="game" tabindex="-1"></canvas>

    <div id="start">
      <h1 id="start-title">TruckBuild</h1>
      <button id="start-button" type="button">Play</button>
      <p id="start-hint" hidden></p>
    </div>

    <button id="fullscreen-button" type="button" aria-label="Enter fullscreen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
      </svg>
    </button>

    <noscript>This game needs JavaScript to run.</noscript>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
