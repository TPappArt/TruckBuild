# Runs the game's own checks on every push: the triangle budget, scenery
# standing on the road, contrast, seeded races on every track, and races
# with a driver doing anything at all.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run check
      - run: npm run check:tracks
      - run: npm run check:contrast
      - run: npm run simulate
      - run: npm run fuzz
